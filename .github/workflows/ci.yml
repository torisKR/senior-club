name: CI

on:
  workflow_call:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Android checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
      EXPO_PUBLIC_APP_ENV: development

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          version: 9.14.2
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify security dependency compatibility
        run: node --test scripts/security-dependency-compatibility.test.mjs

      - name: Check Android app
        run: |
          pnpm --filter mobile lint
          pnpm --filter mobile typecheck
          pnpm --filter mobile test
          pnpm --filter mobile exec expo export --platform android --output-dir /tmp/senior-club-android-export

      - name: Check release validators
        run: |
          pnpm --filter mobile test:release-validators
          pnpm --filter mobile test:manifest:merged
          pnpm --filter mobile validate:play-internal-workflow
          pnpm --filter mobile validate:play-production-workflow
          pnpm --filter mobile validate:play
          pnpm --filter mobile validate:manifest
