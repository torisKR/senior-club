name: Android Play production release

on:
  workflow_call:
    inputs:
      binary_update:
        description: Update the published app binary without modifying existing store listing assets
        required: false
        default: false
        type: boolean
      submit_to_play:
        description: Submit the validated AAB to the Google Play production draft track
        required: false
        default: true
        type: boolean
  workflow_dispatch:
    inputs:
      submit_to_play:
        description: 검증된 AAB를 Google Play production 트랙 draft로 제출
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: android-play-production-release
  cancel-in-progress: false

jobs:
  build:
    name: Build and submit production AAB
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: play-store-production
    env:
      CI: "true"
      KAKAO_NATIVE_APP_KEY: ${{ secrets.KAKAO_NATIVE_APP_KEY }}
      FINAL_SCREENSHOT_MANIFEST: store-listing/screenshots/final/ko-KR/manifest.json
      SUBMIT_TO_PLAY: ${{ github.event_name == 'push' || inputs.submit_to_play }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare ephemeral release paths
        run: |
          set -euo pipefail
          echo "EVIDENCE_DIR=$RUNNER_TEMP/android-play-production-evidence" >> "$GITHUB_ENV"
          echo "EAS_PRODUCTION_ENV_FILE=$RUNNER_TEMP/senior-club-eas-production-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.env" >> "$GITHUB_ENV"

      - name: Fail if release configuration is missing
        env:
          REQUIRED_EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          REQUIRED_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          REQUIRED_KAKAO_NATIVE_APP_KEY: ${{ secrets.KAKAO_NATIVE_APP_KEY }}
          REQUIRED_EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
          REQUIRED_EXPO_PUBLIC_WEB_URL: ${{ vars.EXPO_PUBLIC_WEB_URL }}
        run: |
          set -euo pipefail
          missing=0
          if [[ -z "$REQUIRED_KAKAO_NATIVE_APP_KEY" ]]; then
            echo "::error::play-store-production environment secret KAKAO_NATIVE_APP_KEY is required."
            missing=1
          fi
          if [[ -z "$REQUIRED_EXPO_TOKEN" ]]; then
            echo "::error::play-store-production environment secret EXPO_TOKEN is required."
            missing=1
          fi
          if [[ -z "$REQUIRED_GOOGLE_SERVICES_JSON_BASE64" ]]; then
            echo "::error::play-store-production environment secret GOOGLE_SERVICES_JSON_BASE64 is required."
            missing=1
          fi
          if [[ -z "$REQUIRED_EXPO_PUBLIC_API_URL" ]]; then
            echo "::error::play-store-production environment variable EXPO_PUBLIC_API_URL is required."
            missing=1
          fi
          if [[ -z "$REQUIRED_EXPO_PUBLIC_WEB_URL" ]]; then
            echo "::error::play-store-production environment variable EXPO_PUBLIC_WEB_URL is required."
            missing=1
          fi
          if [[ "$missing" -ne 0 ]]; then
            exit 1
          fi

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.14.2
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Run mobile release quality checks
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm test:release-validators
          pnpm validate:play-internal-workflow
          pnpm validate:play-production-workflow
          npx --yes expo-doctor@1.20.1

      - name: Verify GitHub vars match EAS production endpoints
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPECTED_EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
          EXPECTED_EXPO_PUBLIC_WEB_URL: ${{ vars.EXPO_PUBLIC_WEB_URL }}
        run: |
          # shellcheck disable=SC2016
          set -euo pipefail
          umask 077
          rm -f -- "$EAS_PRODUCTION_ENV_FILE"
          cleanup_eas_env() {
            rm -f -- "$EAS_PRODUCTION_ENV_FILE"
          }
          trap cleanup_eas_env EXIT
          npx --yes eas-cli@21.3.0 env:pull \
            --environment production \
            --non-interactive \
            --path "$EAS_PRODUCTION_ENV_FILE" \
            >/dev/null
          # shellcheck disable=SC2016
          node -e '
            const fs = require("node:fs");
            const source = fs.readFileSync(process.env.EAS_PRODUCTION_ENV_FILE, "utf8");
            const values = Object.create(null);
            for (const line of source.split(/\r?\n/)) {
              const match = line.match(/^\s*(?:export\s+)?(EXPO_PUBLIC_API_URL|EXPO_PUBLIC_WEB_URL)\s*=(.*)$/);
              if (!match) continue;
              const name = match[1];
              if (Object.hasOwn(values, name)) throw new Error(`${name} is duplicated in EAS production.`);
              let value = match[2].trim();
              const quoted =
                (value.startsWith("\"") && value.endsWith("\"")) ||
                (value.startsWith("\u0027") && value.endsWith("\u0027"));
              if (quoted) value = value.slice(1, -1);
              values[name] = value;
            }
            for (const name of ["EXPO_PUBLIC_API_URL", "EXPO_PUBLIC_WEB_URL"]) {
              if (!Object.hasOwn(values, name)) throw new Error(`${name} is missing from EAS production.`);
              if (values[name] !== process.env[`EXPECTED_${name}`]) {
                throw new Error(`${name} differs between GitHub vars and EAS production.`);
              }
            }
            console.log("GitHub vars and EAS production endpoint values match.");
          '

      - name: Bind final screenshot evidence to checked-out commit
        if: ${{ !inputs.binary_update }}
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          node -e '
            const fs = require("node:fs");
            if (!/^[0-9a-f]{40}$/.test(process.env.GITHUB_SHA ?? "")) {
              throw new Error("GITHUB_SHA must be the full lowercase 40-character commit SHA.");
            }
            const manifest = JSON.parse(
              fs.readFileSync(process.env.FINAL_SCREENSHOT_MANIFEST, "utf8"),
            );
            if (manifest?.capture?.commit !== process.env.GITHUB_SHA) {
              throw new Error("Final screenshot capture.commit must exactly equal GITHUB_SHA.");
            }
            console.log("Final screenshot evidence is bound to the checked-out commit.");
          '

      - name: Materialize Firebase Android client file
        id: google_services
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          google_services_path="$RUNNER_TEMP/senior-club-google-services-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
          printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > "$google_services_path"
          GOOGLE_SERVICES_JSON_PATH="$google_services_path" node -e '
            const fs = require("node:fs");
            const config = JSON.parse(fs.readFileSync(process.env.GOOGLE_SERVICES_JSON_PATH, "utf8"));
            const clients = Array.isArray(config.client) ? config.client : [];
            const matchesPackage = clients.some(
              (client) =>
                client?.client_info?.android_client_info?.package_name === "com.toris.seniorclub",
            );
            if (!config?.project_info?.project_id || !matchesPackage) {
              throw new Error("Firebase client JSON does not contain com.toris.seniorclub.");
            }
          '
          printf 'path=%s\n' "$google_services_path" >> "$GITHUB_OUTPUT"

      - name: Run production release preflight with final screenshot evidence
        if: ${{ !inputs.binary_update }}
        working-directory: apps/mobile
        env:
          EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
          EXPO_PUBLIC_WEB_URL: ${{ vars.EXPO_PUBLIC_WEB_URL }}
          GOOGLE_SERVICES_JSON: ${{ steps.google_services.outputs.path }}
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          pnpm release:android:preflight \
            --screenshot-manifest "$FINAL_SCREENSHOT_MANIFEST" \
            2>&1 | tee "$EVIDENCE_DIR/preflight.log"
          cp "$FINAL_SCREENSHOT_MANIFEST" "$EVIDENCE_DIR/final-screenshot-manifest.json"
          sha256sum "$FINAL_SCREENSHOT_MANIFEST" > "$EVIDENCE_DIR/final-screenshot-manifest.sha256"
          printf '%s\n' "$GITHUB_SHA" > "$EVIDENCE_DIR/source-commit.txt"

      - name: Validate published app update and Play credentials
        if: ${{ inputs.binary_update }}
        working-directory: apps/mobile
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          EXPO_PUBLIC_APP_ENV: production
          EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
          EXPO_PUBLIC_WEB_URL: ${{ vars.EXPO_PUBLIC_WEB_URL }}
          GOOGLE_SERVICES_JSON: ${{ steps.google_services.outputs.path }}
        run: |
          set -euo pipefail
          umask 077
          node -e '
            const fs = require("node:fs");
            const key = JSON.parse(process.env.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON || "null");
            if (key?.type !== "service_account" || key.client_email !== "senior-club-play-uploader@clubsenior-app.iam.gserviceaccount.com" || !key.private_key) {
              throw new Error("GOOGLE_PLAY_SERVICE_ACCOUNT_JSON must contain the app-scoped Play service account.");
            }
            fs.writeFileSync("/tmp/senior-club-play-service-account.json", JSON.stringify(key), {mode: 0o600});
          '
          mkdir -p "$EVIDENCE_DIR"
          pnpm validate:play
          pnpm validate:manifest
          node scripts/validate-release-endpoints.mjs
          printf '%s\n' "$GITHUB_SHA" > "$EVIDENCE_DIR/source-commit.txt"

      - name: Build Play production AAB with EAS CLI 21.3.0
        id: eas_build
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
          EXPO_PUBLIC_WEB_URL: ${{ vars.EXPO_PUBLIC_WEB_URL }}
        run: |
          set -euo pipefail
          npx --yes eas-cli@21.3.0 build \
            --platform android \
            --profile production \
            --non-interactive \
            --wait \
            --json > "$EVIDENCE_DIR/eas-build-result.json"
          test -s "$EVIDENCE_DIR/eas-build-result.json"

      - name: Validate the exact EAS build ID
        id: build_id
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          build_id="$(
            node scripts/extract-eas-build-id.mjs \
              "$EVIDENCE_DIR/eas-build-result.json" \
              --evidence "$EVIDENCE_DIR/validated-build.json"
          )"
          printf 'build_id=%s\n' "$build_id" >> "$GITHUB_OUTPUT"

      - name: Submit the exact build to Play production draft
        if: ${{ success() && env.SUBMIT_TO_PLAY == 'true' && !inputs.binary_update }}
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_BUILD_ID: ${{ steps.build_id.outputs.build_id }}
        run: |
          set -euo pipefail
          npx --yes eas-cli@21.3.0 submit \
            --platform android \
            --profile production \
            --id "$EAS_BUILD_ID" \
            --non-interactive \
            --wait

      - name: Submit the exact published app update
        if: ${{ success() && env.SUBMIT_TO_PLAY == 'true' && inputs.binary_update }}
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_BUILD_ID: ${{ steps.build_id.outputs.build_id }}
        run: |
          set -euo pipefail
          npx --yes eas-cli@21.3.0 submit \
            --platform android \
            --profile productionUpdate \
            --id "$EAS_BUILD_ID" \
            --non-interactive \
            --wait

      - name: Upload release evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: android-play-production-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: warn
          retention-days: 30

      - name: Remove temporary release configuration
        if: ${{ always() }}
        run: |
          set -euo pipefail
          google_services_path="$RUNNER_TEMP/senior-club-google-services-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
          rm -f -- "$google_services_path"
          rm -f -- "$EAS_PRODUCTION_ENV_FILE"
          rm -f -- /tmp/senior-club-play-service-account.json
