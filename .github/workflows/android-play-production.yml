name: Android Play production release

on:
  workflow_call:
    inputs:
      internal_release:
        description: Internal draft only; cannot be combined with binary_update
        required: false
        default: false
        type: boolean
      binary_update:
        description: Update the published app binary without modifying existing store listing assets
        required: false
        default: false
        type: boolean
      submit_to_play:
        description: Submit the validated AAB to the Google Play production draft track
        required: false
        default: true
        type: boolean
  workflow_dispatch:
    inputs:
      submit_to_play:
        description: 검증된 AAB를 Google Play production 트랙 draft로 제출
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: android-play-release
  cancel-in-progress: false

jobs:
  build:
    name: Build and submit production AAB
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: ${{ inputs.internal_release && 'play-internal' || 'play-store-production' }}
    env:
      CI: "true"
      EXPO_NO_DOTENV: '1'
      ANDROID_UPLOAD_CERT_SHA256: ${{ secrets.ANDROID_UPLOAD_CERT_SHA256 }}
      KAKAO_NATIVE_APP_KEY: ${{ secrets.KAKAO_NATIVE_APP_KEY }}
      FINAL_SCREENSHOT_MANIFEST: store-listing/screenshots/final/ko-KR/manifest.json
      SUBMIT_TO_PLAY: ${{ github.event_name == 'push' || inputs.submit_to_play }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare ephemeral release paths
        env:
          INTERNAL_RELEASE: ${{ inputs.internal_release }}
          BINARY_UPDATE: ${{ inputs.binary_update }}
        run: |
          set -euo pipefail
          echo "EVIDENCE_DIR=$RUNNER_TEMP/android-play-production-evidence" >> "$GITHUB_ENV"
          echo "BUNDLETOOL_JAR=$RUNNER_TEMP/bundletool.jar" >> "$GITHUB_ENV"
          test "$GITHUB_RUN_ATTEMPT" = 1
          if [[ "$INTERNAL_RELEASE" == true && "$BINARY_UPDATE" == true ]]; then
            echo '::error::Internal releases cannot bypass screenshot evidence.'
            exit 1
          fi
          if [[ "$SUBMIT_TO_PLAY" == true && "$GITHUB_REF" != refs/heads/main ]]; then
            echo '::error::Play uploads require reviewed main.'
            exit 1
          fi

      - name: Fail if release configuration is missing
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          REQUIRED_GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          REQUIRED_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          REQUIRED_KAKAO_NATIVE_APP_KEY: ${{ secrets.KAKAO_NATIVE_APP_KEY }}
          REQUIRED_EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
          REQUIRED_EXPO_PUBLIC_WEB_URL: ${{ vars.EXPO_PUBLIC_WEB_URL }}
        run: |
          set -euo pipefail
          missing=0
          if [[ -z "$REQUIRED_KAKAO_NATIVE_APP_KEY" ]]; then
            echo "::error::play-store-production environment secret KAKAO_NATIVE_APP_KEY is required."
            missing=1
          fi
          python3 apps/mobile/scripts/direct-play-release.py check-signing || missing=1
          if [[ -z "$REQUIRED_GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" ]]; then
            echo "::error::play-store-production environment secret GOOGLE_PLAY_SERVICE_ACCOUNT_JSON is required."
            missing=1
          fi
          if [[ -z "$REQUIRED_GOOGLE_SERVICES_JSON_BASE64" ]]; then
            echo "::error::play-store-production environment secret GOOGLE_SERVICES_JSON_BASE64 is required."
            missing=1
          fi
          if [[ -z "$REQUIRED_EXPO_PUBLIC_API_URL" ]]; then
            echo "::error::play-store-production environment variable EXPO_PUBLIC_API_URL is required."
            missing=1
          fi
          if [[ -z "$REQUIRED_EXPO_PUBLIC_WEB_URL" ]]; then
            echo "::error::play-store-production environment variable EXPO_PUBLIC_WEB_URL is required."
            missing=1
          fi
          if [[ "$missing" -ne 0 ]]; then
            exit 1
          fi

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.14.2
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Run mobile release quality checks
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm test:release-validators
          pnpm validate:play-internal-workflow
          pnpm validate:play-production-workflow
          npx --yes expo-doctor@1.20.1

      - name: Verify release endpoints and Play service account
        working-directory: apps/mobile
        env:
          EXPECTED_EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
          EXPECTED_EXPO_PUBLIC_WEB_URL: ${{ vars.EXPO_PUBLIC_WEB_URL }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          umask 077
          node -e '
            const fs = require("node:fs");
            const key = JSON.parse(process.env.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON || "null");
            if (key?.type !== "service_account" || key.client_email !== "toris-play-uploader@toris-play-uploader.iam.gserviceaccount.com" || !key.private_key) {
              throw new Error("GOOGLE_PLAY_SERVICE_ACCOUNT_JSON must contain the app-scoped Play service account.");
            }
            fs.writeFileSync("/tmp/senior-club-play-service-account.json", JSON.stringify(key), {mode: 0o600});
          '
          test "$EXPECTED_EXPO_PUBLIC_API_URL" = "https://d33totqtaqpyfs.cloudfront.net"
          test "$EXPECTED_EXPO_PUBLIC_WEB_URL" = "https://senior.toris.kr"
          echo "Release endpoints and Play service account are valid."

      - name: Bind final screenshot evidence to checked-out commit
        if: ${{ !inputs.binary_update }}
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          node -e '
            const fs = require("node:fs");
            if (!/^[0-9a-f]{40}$/.test(process.env.GITHUB_SHA ?? "")) {
              throw new Error("GITHUB_SHA must be the full lowercase 40-character commit SHA.");
            }
            const manifest = JSON.parse(
              fs.readFileSync(process.env.FINAL_SCREENSHOT_MANIFEST, "utf8"),
            );
            if (manifest?.capture?.commit !== process.env.GITHUB_SHA) {
              throw new Error("Final screenshot capture.commit must exactly equal GITHUB_SHA.");
            }
            console.log("Final screenshot evidence is bound to the checked-out commit.");
          '

      - name: Materialize Firebase Android client file
        id: google_services
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          google_services_path="$RUNNER_TEMP/senior-club-google-services-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
          printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > "$google_services_path"
          GOOGLE_SERVICES_JSON_PATH="$google_services_path" node -e '
            const fs = require("node:fs");
            const config = JSON.parse(fs.readFileSync(process.env.GOOGLE_SERVICES_JSON_PATH, "utf8"));
            const clients = Array.isArray(config.client) ? config.client : [];
            const matchesPackage = clients.some(
              (client) =>
                client?.client_info?.android_client_info?.package_name === "com.toris.seniorclub",
            );
            if (!config?.project_info?.project_id || !matchesPackage) {
              throw new Error("Firebase client JSON does not contain com.toris.seniorclub.");
            }
          '
          printf 'path=%s\n' "$google_services_path" >> "$GITHUB_OUTPUT"

      - name: Run production release preflight with final screenshot evidence
        if: ${{ !inputs.binary_update }}
        working-directory: apps/mobile
        env:
          EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
          EXPO_PUBLIC_WEB_URL: ${{ vars.EXPO_PUBLIC_WEB_URL }}
          GOOGLE_SERVICES_JSON: ${{ steps.google_services.outputs.path }}
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          pnpm release:android:preflight \
            --screenshot-manifest "$FINAL_SCREENSHOT_MANIFEST" \
            2>&1 | tee "$EVIDENCE_DIR/preflight.log"
          cp "$FINAL_SCREENSHOT_MANIFEST" "$EVIDENCE_DIR/final-screenshot-manifest.json"
          sha256sum "$FINAL_SCREENSHOT_MANIFEST" > "$EVIDENCE_DIR/final-screenshot-manifest.sha256"
          printf '%s\n' "$GITHUB_SHA" > "$EVIDENCE_DIR/source-commit.txt"

      - name: Validate published app update
        if: ${{ inputs.binary_update }}
        working-directory: apps/mobile
        env:
          EXPO_PUBLIC_APP_ENV: production
          EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
          EXPO_PUBLIC_WEB_URL: ${{ vars.EXPO_PUBLIC_WEB_URL }}
          GOOGLE_SERVICES_JSON: ${{ steps.google_services.outputs.path }}
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          pnpm validate:play
          pnpm validate:manifest
          node scripts/validate-release-endpoints.mjs
          printf '%s\n' "$GITHUB_SHA" > "$EVIDENCE_DIR/source-commit.txt"

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Allocate versionCode from Play history
        working-directory: apps/mobile
        run: python3 scripts/direct-play-release.py allocate

      - name: Build Play production AAB directly
        working-directory: apps/mobile
        env:
          EXPO_PUBLIC_APP_ENV: production
          EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
          EXPO_PUBLIC_WEB_URL: ${{ vars.EXPO_PUBLIC_WEB_URL }}
          GOOGLE_SERVICES_JSON: ${{ steps.google_services.outputs.path }}
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          export ANDROID_UPLOAD_KEYSTORE_PATH="$RUNNER_TEMP/upload.keystore"
          printf '%s' "$ANDROID_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_UPLOAD_KEYSTORE_PATH"
          pnpm exec expo prebuild --platform android --clean --no-install
          printf '\napply from: "../../scripts/release-signing.gradle"\n' >> android/app/build.gradle
          cd android
          ./gradlew :app:bundleRelease --no-daemon
          test -s app/build/outputs/bundle/release/app-release.aab
          cp app/build/outputs/bundle/release/app-release.aab "$EVIDENCE_DIR/app-release.aab"

      - name: Validate exact signed AAB
        working-directory: apps/mobile
        env:
          EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
          EXPO_PUBLIC_WEB_URL: ${{ vars.EXPO_PUBLIC_WEB_URL }}
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error https://github.com/google/bundletool/releases/download/1.18.2/bundletool-all-1.18.2.jar -o "$BUNDLETOOL_JAR"
          printf '378b5434cd1378bef6b2bc527b8c7f0ff2584b273830335bce54d6d0813c8584  %s\n' "$BUNDLETOOL_JAR" | sha256sum --check
          python3 scripts/direct-play-release.py validate

      - name: Submit exact validated artifact to Play
        if: ${{ success() && env.SUBMIT_TO_PLAY == 'true' }}
        working-directory: apps/mobile
        env:
          EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
          EXPO_PUBLIC_WEB_URL: ${{ vars.EXPO_PUBLIC_WEB_URL }}
          PLAY_TRACK: ${{ inputs.internal_release && 'internal' || 'production' }}
          PLAY_STATUS: ${{ !inputs.internal_release && inputs.binary_update && 'completed' || 'draft' }}
        run: python3 scripts/direct-play-release.py upload

      - name: Upload release evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: android-play-production-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: warn
          retention-days: 30

      - name: Remove temporary release configuration
        if: ${{ always() }}
        run: |
          set -euo pipefail
          google_services_path="$RUNNER_TEMP/senior-club-google-services-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
          rm -f -- "$google_services_path"
          rm -f -- "$RUNNER_TEMP/upload.keystore" "$RUNNER_TEMP/play-jwt.pem"
          rm -f -- apps/mobile/android/app/google-services.json
          rm -f -- /tmp/senior-club-play-service-account.json
