name: Android Play internal release

on:
  workflow_dispatch:
    inputs:
      submit_to_play:
        description: 검증된 AAB를 Google Play 내부 트랙 draft로 제출
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/android-play-production.yml
    with:
      internal_release: true
      binary_update: false
      submit_to_play: ${{ inputs.submit_to_play }}
    secrets: inherit
