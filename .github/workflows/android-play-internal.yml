name: Android Play internal release

on:
  workflow_dispatch:
    inputs:
      screenshot_evidence_run_id:
        description: 동일 main SHA의 검토 완료된 screenshot issuer workflow run ID
        required: true
        type: string
      submit_to_play:
        description: 검증된 AAB를 Google Play 내부 트랙 draft로 제출
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

jobs:
  build:
    uses: ./.github/workflows/android-play-production.yml
    with:
      internal_release: true
      binary_update: false
      screenshot_evidence_run_id: ${{ inputs.screenshot_evidence_run_id }}
      submit_to_play: ${{ inputs.submit_to_play }}
    secrets: inherit
