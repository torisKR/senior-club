name: Deploy main

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      screenshot_evidence_run_id:
        description: Optional reviewed screenshot issuer run at this exact main SHA; enables Android candidate build
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  quality:
    name: Validate before deploying
    uses: ./.github/workflows/ci.yml

  android:
    name: Play production workflow
    needs: [quality]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.screenshot_evidence_run_id != '' && needs.quality.result == 'success' }}
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/android-play-production.yml
    with:
      screenshot_evidence_run_id: ${{ inputs.screenshot_evidence_run_id }}
      binary_update: true
      # Build the Android candidate only with reviewed evidence at this source SHA.
      submit_to_play: false
    secrets: inherit
