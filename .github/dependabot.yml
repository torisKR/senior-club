version: 2

updates:
  # One pnpm workspace: the root pnpm-lock.yaml governs `.` and apps/mobile.
  # Dependabot must run from the workspace root and use
  # `directories` so every manifest bump lands in that single lockfile.
  # Per-directory npm entries cannot update the root lockfile and produce PRs
  # that fail `pnpm install --frozen-lockfile`.
  - package-ecosystem: npm
    directories:
      - /
      - /apps/mobile
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Asia/Seoul
    open-pull-requests-limit: 5
    versioning-strategy: increase
    labels:
      - dependencies
    groups:
      # Batch low-risk upgrades so CI runs once per week instead of per package.
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      # Keep the supported TypeScript major until the Expo upgrade.
      - dependency-name: "typescript"
        versions: [">=7.0.0 <7.1.0"]
      # Expo and React Native versions are pinned to the installed SDK. Majors
      # move only as part of a deliberate SDK upgrade.
      - dependency-name: "expo"
        update-types: ["version-update:semver-major"]
      - dependency-name: "expo-*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@expo/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-native"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-native-*"
        update-types: ["version-update:semver-major"]
      # React and the test renderer must stay on the same major version.
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Asia/Seoul
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci
    groups:
      actions:
        patterns:
          - "*"
